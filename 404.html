<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Regulação Floripa</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #f4f6fa; color: #2b3446;
         font-family: Montserrat, "Segoe UI", system-ui, Arial, sans-serif;
         line-height: 1.6; padding: 24px; }
  .caixa { max-width: 480px; text-align: center; }
  h1 { color: #10182b; font-size: 1.4rem; margin: 0 0 12px; }
  a { display: inline-block; margin-top: 18px; background: #004aad; color: #fff;
      text-decoration: none; font-weight: 600; padding: 11px 22px;
      border-radius: 999px; }
</style>
</head>
<body>
<div class="caixa">
  <h1>Página não encontrada</h1>
  <p>O endereço que você abriu não existe neste site. Pode ser um link antigo ou
     um erro de digitação.</p>
  <a id="ir" href="/">Ir para a página inicial</a>
</div>
<script>
  (function () {
    var partes = location.pathname.split('/');
    var destino = (location.hostname.indexOf('github.io') !== -1 && partes[1])
      ? '/' + partes[1] + '/' : '/';
    document.getElementById('ir').setAttribute('href', destino);
  })();
</script>
</body>
</html>
